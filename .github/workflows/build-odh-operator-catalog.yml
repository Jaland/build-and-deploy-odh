# Build ODH stack: AI Gateway module operator, then ODH operator + OLM bundle + catalog.
# Flow: ODH operator → AI Gateway → MaaS (manifest overrides via get_all_manifests.sh).
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   QUAY_REPO              Operator image path without tag (default: quay.io/maas/opendatahub-operator)
#   QUAY_AI_GATEWAY_REPO   AI Gateway module operator image path without tag (default: quay.io/maas/ai-gateway-operator)
#   QUAY_BUNDLE_REPO       Optional OLM bundle path without tag
#   QUAY_CATALOG_REPO      Optional catalog index path without tag
#   QUAY_UNIFIED_IMAGE_TAG One tag for operator, bundle, catalog, and AI Gateway (vX.Y.Z or X.Y.Z)
#   OPERATOR_REPO_URL / OPERATOR_GIT_REF
#   AI_GATEWAY_REPO_URL / AI_GATEWAY_GIT_REF
#   MAAS_REPO_URL / MAAS_GIT_REF
#   MAAS_CONTROLLER_IMAGE / MAAS_API_IMAGE  Optional MaaS operand overrides
#
# Secrets: QUAY_USERNAME, QUAY_PASSWORD (required); KUBECONFIG (optional bundle deploy)

name: Build ODH stack

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      unified_image_tag:
        description: "QUAY_UNIFIED_IMAGE_TAG — vX.Y.Z or X.Y.Z for all stack images"
        required: false
        default: ""
        type: string
      image_tag_base:
        description: "Operator image path without tag (empty = QUAY_REPO)"
        required: false
        default: ""
        type: string
      ai_gateway_image_repo:
        description: "AI Gateway image path without tag (empty = QUAY_AI_GATEWAY_REPO)"
        required: false
        default: ""
        type: string
      bundle_repo:
        description: "OLM bundle path without tag (empty = QUAY_BUNDLE_REPO)"
        required: false
        default: ""
        type: string
      catalog_repo:
        description: "Catalog path without tag (empty = QUAY_CATALOG_REPO)"
        required: false
        default: ""
        type: string
      operator_repo_url:
        description: "opendatahub-operator clone URL (empty = upstream or OPERATOR_REPO_URL var)"
        required: false
        default: ""
        type: string
      operator_git_ref:
        description: "opendatahub-operator branch/tag/commit (empty = OPERATOR_GIT_REF var or main)"
        required: false
        default: ""
        type: string
      ai_gateway_repo_url:
        description: "ai-gateway-operator clone URL (empty = upstream or AI_GATEWAY_REPO_URL var)"
        required: false
        default: ""
        type: string
      ai_gateway_git_ref:
        description: "ai-gateway-operator branch/tag/commit (empty = AI_GATEWAY_GIT_REF var or main)"
        required: false
        default: ""
        type: string
      maas_repo_url:
        description: "MaaS manifests repo URL (empty = MAAS_REPO_URL var; default maas-billing upstream)"
        required: false
        default: ""
        type: string
      maas_git_ref:
        description: "MaaS branch/tag/commit (empty = MAAS_GIT_REF var or main)"
        required: false
        default: ""
        type: string
      maas_controller_image:
        description: "Optional maas-controller operand image"
        required: false
        default: ""
        type: string
      maas_api_image:
        description: "Optional maas-api operand image"
        required: false
        default: ""
        type: string
      deploy_bundle:
        description: "Run operator-sdk run bundle after push (needs KUBECONFIG secret)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      ai_gateway_image: ${{ steps.export.outputs.ai_gateway_image }}
      operator_image: ${{ steps.export.outputs.operator_image }}
      bundle_image: ${{ steps.export.outputs.bundle_image }}
      catalog_image: ${{ steps.export.outputs.catalog_image }}
      version: ${{ steps.export.outputs.version }}
      operator_starting_csv: ${{ steps.export.outputs.operator_starting_csv }}
      maas_deploy_command: ${{ steps.export.outputs.maas_deploy_command }}
      maas_deploy_snippet: ${{ steps.export.outputs.maas_deploy_snippet }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Install kubectl (bundle deploy only)
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_bundle == true
        run: |
          curl -sSL -o kubectl "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -m 755 kubectl /usr/local/bin/kubectl

      - name: Write kubeconfig (bundle deploy only)
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_bundle == true
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -z "${KUBECONFIG_CONTENT}" ]; then
            echo "When deploy_bundle is true, add repository secret KUBECONFIG with your kubeconfig contents."
            exit 1
          fi
          printf '%s\n' "${KUBECONFIG_CONTENT}" > "${GITHUB_WORKSPACE}/kubeconfig"
          chmod 600 "${GITHUB_WORKSPACE}/kubeconfig"
          echo "KUBECONFIG=${GITHUB_WORKSPACE}/kubeconfig" >> "$GITHUB_ENV"

      - name: Build and push stack
        env:
          IMAGE_TAG_BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag_base != '' && inputs.image_tag_base || vars.QUAY_REPO || secrets.QUAY_REPO || 'quay.io/maas/opendatahub-operator' }}
          AI_GATEWAY_IMAGE_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.ai_gateway_image_repo != '' && inputs.ai_gateway_image_repo || vars.QUAY_AI_GATEWAY_REPO || secrets.QUAY_AI_GATEWAY_REPO || 'quay.io/maas/ai-gateway-operator' }}
          UNIFIED_IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.unified_image_tag != '' && inputs.unified_image_tag || vars.QUAY_UNIFIED_IMAGE_TAG || secrets.QUAY_UNIFIED_IMAGE_TAG }}
          BUNDLE_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_repo != '' && inputs.bundle_repo || vars.QUAY_BUNDLE_REPO || secrets.QUAY_BUNDLE_REPO }}
          CATALOG_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.catalog_repo != '' && inputs.catalog_repo || vars.QUAY_CATALOG_REPO || secrets.QUAY_CATALOG_REPO }}
          OPERATOR_REPO_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.operator_repo_url != '' && inputs.operator_repo_url || vars.OPERATOR_REPO_URL || secrets.OPERATOR_REPO_URL || '' }}
          OPERATOR_GIT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.operator_git_ref != '' && inputs.operator_git_ref || vars.OPERATOR_GIT_REF || secrets.OPERATOR_GIT_REF || 'main' }}
          AI_GATEWAY_REPO_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.ai_gateway_repo_url != '' && inputs.ai_gateway_repo_url || vars.AI_GATEWAY_REPO_URL || secrets.AI_GATEWAY_REPO_URL || '' }}
          AI_GATEWAY_GIT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ai_gateway_git_ref != '' && inputs.ai_gateway_git_ref || vars.AI_GATEWAY_GIT_REF || secrets.AI_GATEWAY_GIT_REF || 'main' }}
          MAAS_REPO_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.maas_repo_url != '' && inputs.maas_repo_url || vars.MAAS_REPO_URL || secrets.MAAS_REPO_URL || '' }}
          MAAS_GIT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.maas_git_ref != '' && inputs.maas_git_ref || vars.MAAS_GIT_REF || secrets.MAAS_GIT_REF || '' }}
          MAAS_CONTROLLER_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.maas_controller_image != '' && inputs.maas_controller_image || vars.MAAS_CONTROLLER_IMAGE || secrets.MAAS_CONTROLLER_IMAGE || '' }}
          MAAS_API_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.maas_api_image != '' && inputs.maas_api_image || vars.MAAS_API_IMAGE || secrets.MAAS_API_IMAGE || '' }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          DEPLOY_BUNDLE: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_bundle == true && '1' || '0' }}
        run: ./scripts/build-odh-stack.sh

      - name: Export job outputs
        id: export
        run: |
          set -a
          source "${{ github.workspace }}/ai-gateway-build-output.env"
          source "${{ github.workspace }}/build-output.env"
          set +a
          {
            echo "ai_gateway_image=${AI_GATEWAY_IMAGE}"
            echo "operator_image=${OPERATOR_IMAGE}"
            echo "bundle_image=${BUNDLE_IMAGE}"
            echo "catalog_image=${CATALOG_IMAGE}"
            echo "version=${VERSION}"
            echo "operator_starting_csv=${OPERATOR_STARTING_CSV}"
            echo "maas_deploy_command=${MAAS_DEPLOY_COMMAND}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "maas_deploy_snippet<<MAAS_SNIP"
            echo "${MAAS_DEPLOY_SNIPPET}"
            echo "MAAS_SNIP"
          } >> "$GITHUB_OUTPUT"
          echo "### Built stack (ODH → AI Gateway → MaaS)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "When \`QUAY_UNIFIED_IMAGE_TAG\` is set, **operator**, **AI Gateway**, **bundle**, and **catalog** share that tag." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**AI Gateway:** \`${AI_GATEWAY_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Operator:** \`${OPERATOR_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Bundle:** \`${BUNDLE_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Catalog:** \`${CATALOG_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### MaaS deploy" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "${MAAS_DEPLOY_SNIPPET}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### OpenShift custom catalog" >> "$GITHUB_STEP_SUMMARY"
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          echo "${OPENSHIFT_CATALOG_SNIPPET}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: build-output-env
          path: |
            build-output.env
            ai-gateway-build-output.env
          if-no-files-found: error

      - name: Upload manifest validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: get-all-manifests-validation
          path: manifest-validation/
          if-no-files-found: warn
